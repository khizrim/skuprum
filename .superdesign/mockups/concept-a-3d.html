<head>

<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  body{margin:0;background:#0C0D0F;color:#EDE8E1;font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

<body>
<div id="root" class="relative min-h-screen overflow-hidden">
  <canvas id="stage"></canvas>
  <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(60% 70% at 70% 50%,transparent 0,rgba(12,13,15,.0) 40%,rgba(12,13,15,.85) 100%)"></div>

  <header class="relative z-10 max-w-[1280px] mx-auto px-8 h-20 flex items-center justify-between">
    <a id="logo" href="#top" class="text-[26px] font-semibold tracking-[-0.04em]">skuprum</a>
    <div class="flex items-center gap-8 text-[15px] text-[#9A958E]">
      <a id="nav-prices" href="#prices" class="hover:text-white">Цены</a>
      <a id="nav-how" href="#how" class="hover:text-white">Как работаем</a>
      <a id="nav-contacts" href="#contacts" class="hover:text-white">Адреса</a>
      <a id="header-phone" href="tel:+74993907915" class="text-[#EDE8E1] font-medium num">8 (499) 390-79-15</a>
    </div>
  </header>

  <section id="top" class="relative z-10 max-w-[1280px] mx-auto px-8 pt-24 pb-20 pointer-events-none">
    <div class="text-[13px] uppercase tracking-[0.2em] text-[#D98A55] mb-8">Приём цветного металла · Москва</div>
    <h1 class="disp text-[96px] font-bold max-w-[760px]">Медь<br>по <span class="text-[#E9925A] num">999&nbsp;₽</span><br>за кг</h1>
    <p class="mt-10 text-[19px] leading-[1.55] text-[#B4AEA6] max-w-[440px]">Взвешиваем при вас, платим за пять минут. Вывоз от 50 кг в день заявки.</p>
    <div class="mt-12 flex gap-3 pointer-events-auto">
      <a id="hero-call" href="tel:+74993907915" class="h-14 px-8 rounded-full bg-[#E9925A] text-[#0C0D0F] flex items-center text-[17px] font-semibold hover:bg-[#F2A673] transition">Позвонить</a>
      <a id="hero-wa" href="https://wa.me/79199947355" class="h-14 px-8 rounded-full border border-white/20 flex items-center text-[17px] font-medium hover:border-white/60 transition">WhatsApp</a>
    </div>
  </section>

  <div class="absolute z-10 bottom-0 inset-x-0 border-t border-white/10 bg-[#0C0D0F]/60 backdrop-blur">
    <div class="max-w-[1280px] mx-auto px-8 h-20 grid grid-cols-5 items-center text-[15px] num">
      <div class="flex justify-between pr-8 border-r border-white/10"><span class="text-[#9A958E]">Медь</span><span class="font-semibold">999 ₽</span></div>
      <div class="flex justify-between px-8 border-r border-white/10"><span class="text-[#9A958E]">Кабель</span><span class="font-semibold">888 ₽</span></div>
      <div class="flex justify-between px-8 border-r border-white/10"><span class="text-[#9A958E]">Бронза</span><span class="font-semibold">777 ₽</span></div>
      <div class="flex justify-between px-8 border-r border-white/10"><span class="text-[#9A958E]">Латунь</span><span class="font-semibold">666 ₽</span></div>
      <div class="flex justify-between pl-8"><span class="text-[#9A958E]">Алюминий</span><span class="font-semibold">222 ₽</span></div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0C0D0F');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0.4, 11);

// copper: brushed metal
const copper = new THREE.MeshPhysicalMaterial({ color: '#C46A3A', metalness: 1, roughness: 0.28, clearcoat: 0.3, clearcoatRoughness: 0.35 });
const copperDark = new THREE.MeshPhysicalMaterial({ color: '#9C4E2A', metalness: 1, roughness: 0.38 });

const group = new THREE.Group();
scene.add(group);

// wound coil: several strands wrapped around a hidden core
class Helix extends THREE.Curve {
  constructor(r, h, turns, phase, wobble) { super(); Object.assign(this, { r, h, turns, phase, wobble }); }
  getPoint(t, target = new THREE.Vector3()) {
    const a = t * Math.PI * 2 * this.turns + this.phase;
    const r = this.r + Math.sin(t * 40 + this.phase) * this.wobble;
    return target.set(Math.cos(a) * r, (t - 0.5) * this.h, Math.sin(a) * r);
  }
}
const layers = [[1.25, 0], [1.42, 0.35], [1.59, 0.7], [1.76, 1.05]];
layers.forEach(([r, ph], i) => {
  const tube = new THREE.TubeGeometry(new Helix(r, 2.6, 15, ph, 0.012), 1400, 0.085, 14, false);
  group.add(new THREE.Mesh(tube, i % 2 ? copperDark : copper));
});
// free wire end leaving the coil
const tail = new THREE.CatmullRomCurve3([
  new THREE.Vector3(1.76, 1.3, 0), new THREE.Vector3(2.3, 1.9, 0.6), new THREE.Vector3(2.0, 2.7, 1.4), new THREE.Vector3(1.1, 3.0, 1.9)
]);
group.add(new THREE.Mesh(new THREE.TubeGeometry(tail, 200, 0.085, 14, false), copper));

// lights for warm highlights
const key = new THREE.DirectionalLight('#ffd2b0', 2.4); key.position.set(4, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight('#7fa7ff', 1.2); rim.position.set(-6, -2, -4); scene.add(rim);

group.rotation.set(0.55, 0, -0.35);
group.scale.setScalar(0.74);
function layout() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  group.position.set(w > 900 ? 2.6 : 0, w > 900 ? 0.1 : 1.6, 0);
}
addEventListener('resize', layout); layout();
let mx = 0, my = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; });
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
renderer.setAnimationLoop(t => {
  if (!still) group.rotation.y = t * 0.00018;
  group.rotation.x += ((0.55 + my * 0.25) - group.rotation.x) * 0.05;
  group.rotation.z += ((-0.35 + mx * 0.25) - group.rotation.z) * 0.05;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
